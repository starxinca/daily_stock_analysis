name: 每日股票分析

on:
  # 定时触发（北京时间 18:00，周一到周五）
  schedule:
    - cron: '0 10 * * 1-5'
  # 手动触发
  workflow_dispatch: {}

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      # 检出仓库代码
      - name: 检出代码
        uses: actions/checkout@v4

      # 设置 Python 环境
      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 安装依赖
      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install yfinance matplotlib pandas requests pillow mplfinance ta

      # 创建目录
      - name: 创建目录
        run: |
          mkdir -p reports charts logs

      # 执行 Python 分析
      - name: 执行每日股票分析
        env:
          STOCK_LIST: ${{ secrets.STOCK_LIST }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: |
          echo "=========================================="
          echo "🚀 每日股票分析（汇总推送）"
          echo "⏰ 时间: $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')"
          echo "📊 自选股: $STOCK_LIST"
          echo "=========================================="
          python scripts/daily_analysis.py

      # 上传分析报告（可选查看）
      - name: 上传分析报告
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stock-analysis-reports-${{ github.run_number }}
          path: |
            reports/
            charts/
          retention-days: 30
