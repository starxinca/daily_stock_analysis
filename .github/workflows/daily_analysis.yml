name: 每日股票分析

on:
  schedule:
    # 每天北京时间 18:00 自动运行 (UTC 10:00)
    - cron: '0 10 * * 1-5'
  workflow_dispatch: {}  # 支持手动触发

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install yfinance matplotlib pandas requests pillow mplfinance ta

      - name: 创建目录
        run: |
          mkdir -p reports data logs charts

      - name: 执行股票分析并推送汇总
        env:
          STOCK_LIST: ${{ secrets.STOCK_LIST }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
        run: python - <<EOF
import os, datetime, json, base64, requests
import pandas as pd
import yfinance as yf
import matplotlib.pyplot as plt
import mplfinance as mpf
from io import BytesIO
from ta.momentum import RSIIndicator
from ta.trend import MACD

stocks = os.getenv("STOCK_LIST","600519").split(",")
today = datetime.datetime.now().strftime("%Y-%m-%d")
ALERT_THRESHOLD = 3.0
os.makedirs("charts", exist_ok=True)
os.makedirs("reports", exist_ok=True)

stock_imgs, stock_info, alert_stocks = {}, {}, []

for s in stocks:
    try:
        df = yf.Ticker(s+".SS").history(period="20d")
        if df.empty: continue
        macd = MACD(df['Close']).macd()
        rsi = RSIIndicator(df['Close']).rsi()
        df['MACD'] = macd
        df['RSI'] = rsi
        chart_file = f"charts/{s}_kline.png"
        mpf.plot(df, type='candle', style='charles', savefig=chart_file)
        stock_imgs[s] = chart_file
        last_close = df['Close'].iloc[-1]
        prev_close = df['Close'].iloc[-2]
        change_pct = round((last_close-prev_close)/prev_close*100,2)
        stock_info[s] = {"close": last_close, "change": change_pct, "MACD": round(macd.iloc[-1],2), "RSI": round(rsi.iloc[-1],2)}
        if abs(change_pct) >= ALERT_THRESHOLD:
            alert_stocks.append(s)
    except:
        continue

prices = [v["close"] for v in stock_info.values()]
if prices:
    plt.figure()
    plt.bar(stocks, prices, color=['green' if stock_info[s]["change"]>=0 else 'red' for s in stocks])
    plt.title("收盘价分布")
    plt.tight_layout()
    chart_bar = "charts/price_distribution.png"
    plt.savefig(chart_bar)
    plt.close()

# 调用智谱 AI
api_key = os.getenv("ZHIPU_API_KEY")
prompt = f"请对以下自选股生成今日市场专业投顾分析，包含短中长线建议:\n{','.join(stocks)}\n"
prompt += "\n".join([f"{s}: 收盘{v['close']} 涨跌{v['change']}% MACD{v['MACD']} RSI{v['RSI']}" for s,v in stock_info.items()])

ai_text = "⚠️ 未配置 ZHIPU_API_KEY"
if api_key:
    headers = {"Content-Type": "application/json","Authorization": f"Bearer {api_key}"}
    payload = {"model":"gpt-3.5-mini","prompt":prompt,"temperature":0.7}
    try:
        resp = requests.post("https://open.bigmodel.cn/api/paas/v3/model-api/chat/completions", headers=headers, data=json.dumps(payload))
        ai_text = resp.json().get("choices",[{}])[0].get("message",{}).get("content","⚠️ AI 返回为空")
    except Exception as e:
        ai_text = f"⚠️ AI 调用失败: {e}"

# 生成 Markdown 报告
md_file = "reports/summary_report.md"
with open(md_file,"w",encoding="utf-8") as f:
    f.write(f"# 📊 每日股票分析 V5.6 Ultimate\n🕒 {today}\n\n")
    f.write("## 📊 个股收盘价及技术指标\n")
    for s,v in stock_info.items():
        mark = " ⚠️" if s in alert_stocks else ""
        f.write(f"- {s}: 收盘{v['close']} 涨跌{v['change']}% MACD{v['MACD']} RSI{v['RSI']}{mark}\n")
    f.write("\n## 🧠 AI 专业投顾分析\n" + ai_text + "\n")

# PushPlus 汇总推送
push_token = os.getenv("PUSHPLUS_TOKEN")
if push_token:
    def img_to_base64(path):
        with open(path,"rb") as f:
            return base64.b64encode(f.read()).decode("utf-8")
    content = ai_text + "\n\n"
    if prices:
        content += f"![收盘价分布](data:image/png;base64,{img_to_base64(chart_bar)})\n\n"
    for s,img in stock_imgs.items():
        content += f"## {s} K线图\n![K线图](data:image/png;base64,{img_to_base64(img)})\n\n"
    if alert_stocks:
        content += f"⚠️ 今日涨跌超过 ±{ALERT_THRESHOLD}% 的股票: {','.join(alert_stocks)}\n"
    data = {"token": push_token,"title":f"📈 每日股票分析","content":content,"template":"markdown"}
    try:
        r = requests.post("http://www.pushplus.plus/send", json=data)
        print("✅ PushPlus 推送成功:", r.text)
    except Exception as e:
        print("⚠️ PushPlus 推送失败:", e)
EOF

      - name: 上传报告
        uses: actions/upload-artifact@v4
        with:
          name: analysis-report
          path: reports/
