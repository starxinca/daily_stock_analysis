name: 每日股票分析（汇总推送）

on:
  schedule:
    - cron: '0 10 * * 1-5'   # 每周一到周五 10:00 UTC = 18:00 北京时间
  workflow_dispatch:

concurrency:
  group: stock-analysis
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 创建目录
        run: |
          mkdir -p data logs reports

      - name: 分析股票并汇总推送
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          STOCK_LIST: ${{ secrets.STOCK_LIST }}
          REPORT_TYPE: full
        run: |
          echo "=========================================="
          echo "🚀 A股自选股智能分析系统（汇总推送）"
          echo "⏰ 时间: $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')"
          echo "📊 自选股: $STOCK_LIST"
          echo "📝 报告类型: $REPORT_TYPE"
          echo "=========================================="

          # 分析所有股票，关闭单股推送
          python main.py --no-single-notify

          echo "✅ 所有股票分析完成，准备发送汇总消息..."

          # 调用脚本统一推送 PushPlus
          python scripts/send_pushplus_summary.py \
            --token $PUSHPLUS_TOKEN \
            --stocks "$STOCK_LIST" \
            --report reports/summary_report.md

          echo "✅ PushPlus 汇总推送成功"

      - name: 上传分析报告
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analysis-reports-${{ github.run_number }}
          path: |
            reports/
            logs/
          retention-days: 30
